[package]
name = "cadcraft-ai"
description = "AICAD assistant: drawing context for the AI window, LLM/offline command drafts and script application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
cadcraft-engine = { workspace = true }
# Extracts text from reference documents (PDF, DOCX, UTF-8 text).
cadcraft-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# Staging reference images for the model: sniff format, bound the size, optionally
# downscale, and hand the provider a data URL. Pure Rust decoders keep the wasm gate.
image = { workspace = true }
base64 = "0.23"

# LLM HTTP access is native-only; the wasm build keeps the offline rule engine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
